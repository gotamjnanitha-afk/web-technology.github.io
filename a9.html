<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Elements</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            color: #475569;
            line-height: 1.6;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
        }

        header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: #ffffff;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        header p {
            color: #ffe4e6;
            font-size: 16px;
        }

        nav {
            background: #7f1d1d;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            background: #fecdd3;
            color: #7f1d1d;
        }

        main {
            padding: 40px;
        }

        section,
        article {
            background: #fff1f2;
            border-left: 5px solid #dc2626;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
        }

        section h2,
        article h2 {
            color: #991b1b;
            margin-bottom: 12px;
            font-size: 25px;
        }

        section p,
        article p {
            font-size: 17px;
            color: #475569;
        }

        article {
            border-left-color: #b91c1c;
            background: #ffe4e6;
        }

        footer {
            background: #450a0a;
            color: #fecdd3;
            text-align: center;
            padding: 22px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            header h1 {
                font-size: 28px;
            }

            main {
                padding: 25px 15px;
            }

            nav {
                gap: 5px;
            }

            nav a {
                padding: 8px 12px;
                font-size: 14px;
            }

            section,
            article {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>My College Website</h1>
            <p>Welcome to Our College</p>
        </header>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </nav>

        <main>

            <section>
                <h2>About Our College</h2>
                <p>
                    Our college provides quality education to students.
                </p>
            </section>

            <article>
                <h2>Latest News</h2>
                <p>
                    Admissions are now open for the new academic year.
                </p>
            </article>

        </main>

        <footer>
            <p>Copyright 2026 My College</p>
        </footer>

    </div>

</body>
</html>
