<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Modal Popup</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f6;
    color: #450a0a;
}

header {
    background: #450a0a;
    color: white;
    text-align: center;
    padding: 35px;
}

.container {
    text-align: center;
    padding: 80px 20px;
}

.open-btn {
    display: inline-block;
    background: #b91c1c;
    color: white;
    padding: 14px 28px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}

.open-btn:hover {
    background: #7f1d1d;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(69, 10, 10, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal:target {
    display: flex;
}

.modal-box {
    background: white;
    width: 90%;
    max-width: 450px;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

.modal-box h2 {
    color: #991b1b;
    margin-bottom: 15px;
}

.modal-box p {
    color: #64748b;
    margin-bottom: 25px;
}

.close-btn {
    display: inline-block;
    background: #450a0a;
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
    text-decoration: none;
}

footer {
    background: #450a0a;
    color: #fecdd3;
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>CSS-Only Modal Popup</h1>
</header>

<div class="container">
    <h2>Welcome!</h2>
    <p>Click the button below to open the popup.</p>
    <br>
    <a href="#popup" class="open-btn">Open Popup</a>
</div>

<div id="popup" class="modal">
    <div class="modal-box">
        <h2>Hello!</h2>
        <p>This modal popup is created using only HTML and CSS.</p>
        <a href="#" class="close-btn">Close</a>
    </div>
</div>

<footer>
    CSS Modal Design | Practical Program 70
</footer>

</body>
</html>
