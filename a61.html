<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Template Areas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff5f6;
            padding: 25px;
        }

        .layout {
            max-width: 1100px;
            min-height: 90vh;
            margin: auto;
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 80px 1fr 70px;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 15px;
        }

        .header {
            grid-area: header;
            background: #450a0a;
            color: white;
            padding: 25px;
            border-radius: 12px;
        }

        .sidebar {
            grid-area: sidebar;
            background: #7f1d1d;
            color: white;
            padding: 25px;
            border-radius: 12px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
        }

        .sidebar p {
            margin-bottom: 12px;
            color: #ffe4e6;
        }

        .main {
            grid-area: main;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 7px 20px rgba(127, 29, 29, 0.1);
        }

        .main h2 {
            color: #991b1b;
            margin-bottom: 15px;
        }

        .main p {
            color: #64748b;
            line-height: 1.8;
        }

        .footer {
            grid-area: footer;
            background: #450a0a;
            color: #ffe4e6;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }

        @media (max-width: 650px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <header class="header">
            <h1>CSS Grid Template Areas</h1>
        </header>

        <aside class="sidebar">
            <h2>Menu</h2>
            <p>Home</p>
            <p>About</p>
            <p>Services</p>
            <p>Projects</p>
            <p>Contact</p>
        </aside>

        <main class="main">
            <h2>Main Content</h2>

            <p>
                This layout is created using CSS Grid template areas.
                Each section is assigned a named grid area such as
                header, sidebar, main and footer.
            </p>
        </main>

        <footer class="footer">
            © 2026 Grid Layout
        </footer>

    </div>

</body>
</html>
