<!DOCTYPE html>
<html>
<head>
    <title>Q61 - Reverse String</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 500px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91b1b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            padding: 15px;
            background: #fff1f2;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Reverse a String</h1>
</header>

<div class="card">

    <input type="text" id="text" placeholder="Enter a string">

    <br>

    <button onclick="reverseString()">Reverse</button>

    <p id="result"></p>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function reverseString() {
        const text = document.getElementById("text").value;

        const reversed = text.split("").reverse().join("");

        document.getElementById("result").textContent =
            "Reversed String: " + reversed;
    }
</script>

</body>
</html>
