<!DOCTYPE html>
<html>
<head>
    <title>Q57 - Remove Duplicates</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 550px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .result {
            margin: 15px 0;
            padding: 15px;
            background: #fff1f2;
            border-radius: 8px;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Remove Duplicates</h1>
</header>

<div class="card">

    <input type="text" id="array" placeholder="Example: 1,2,2,3,4,4,5">

    <br>

    <button onclick="removeDuplicates()">Remove</button>

    <div class="result" id="result"></div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function removeDuplicates() {
        const input = document.getElementById("array").value;

        const numbers = input
            .split(",")
            .map(item => item.trim());

        const unique = [...new Set(numbers)];

        document.getElementById("result").textContent =
            "Array without duplicates: " + unique.join(", ");
    }
</script>

</body>
</html>
