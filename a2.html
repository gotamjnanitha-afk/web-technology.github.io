<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
            border-top: 6px solid #991b1b;
        }

        h1 {
            text-align: center;
            color: #7f1d1d;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #fecdd3;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #991b1b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #7f1d1d;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            background: #ffe4e6;
            border-radius: 10px;
            line-height: 2;
            color: #450a0a;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #991b1b;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Arithmetic Operations</h1>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <a href="index.html" class="back">← Back to JavaScript Programs</a>
</div>

<script>
    function calculate() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);

        document.getElementById("result").innerHTML =
            "Addition: " + (a + b) + "<br>" +
            "Subtraction: " + (a - b) + "<br>" +
            "Multiplication: " + (a * b) + "<br>" +
            "Division: " + (b !== 0 ? a / b : "Cannot divide by zero");
    }
</script>

</body>
</html>
