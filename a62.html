<!DOCTYPE html>
<html>
<head>
    <title>Q62 - String Palindrome</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 450px;
            max-width: 85%;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>String Palindrome</h1>
</header>

<div class="card">

    <input type="text" id="text" placeholder="Example: madam">

    <br>

    <button onclick="checkPalindrome()">Check</button>

    <p id="result"></p>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function checkPalindrome() {
        const text = document.getElementById("text").value
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "");

        const reversed = text.split("").reverse().join("");

        document.getElementById("result").textContent =
            text === reversed
                ? "It is a palindrome."
                : "It is not a palindrome.";
    }
</script>

</body>
</html>
