<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audio and Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            color: #475569;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
        }

        .header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: white;
            text-align: center;
            padding: 45px 25px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #ffe4e6;
            font-size: 16px;
        }

        .content {
            padding: 40px;
        }

        .media-section {
            background: #fff1f2;
            border-left: 5px solid #dc2626;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 12px;
            text-align: center;
        }

        h2 {
            color: #991b1b;
            font-size: 26px;
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            max-width: 550px;
        }

        video {
            width: 400px;
            max-width: 100%;
            border-radius: 12px;
            border: 4px solid #fecdd3;
            box-shadow: 0 5px 15px rgba(127, 29, 29, 0.15);
        }

        .media-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
        }

        .footer {
            background: #450a0a;
            color: #fecdd3;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 25px 15px;
            }

            .media-section {
                padding: 20px 15px;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Audio and Video</h1>
            <p>HTML Multimedia Elements</p>
        </div>

        <div class="content">

            <div class="media-section">

                <h2>Audio</h2>

                <div class="media-box">
                    <audio controls>
                        <source src="music.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>

            </div>

            <div class="media-section">

                <h2>Video</h2>

                <div class="media-box">
                    <video controls>
                        <source src="video.mp4" type="video/mp4">
                        Your browser does not support the video element.
                    </video>
                </div>

            </div>

        </div>

        <div class="footer">
            HTML Practical &nbsp; | &nbsp; Audio and Video
        </div>

    </div>

</body>
</html>
