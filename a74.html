<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS calc Function</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f6;
    color: #450a0a;
}

header {
    background: linear-gradient(135deg, #450a0a, #b91c1c);
    color: white;
    text-align: center;
    padding: 40px 20px;
}

.container {
    width: calc(100% - 60px);
    max-width: 1100px;
    margin: 40px auto;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(127,29,29,0.12);
    margin-bottom: 25px;
}

.card h2 {
    color: #991b1b;
    margin-bottom: 20px;
}

.example {
    width: calc(100% - 40px);
    margin: 20px;
    padding: 25px;
    background: #fecdd3;
    border-radius: 12px;
}

.grid {
    display: grid;
    grid-template-columns: calc(50% - 10px) calc(50% - 10px);
    gap: 20px;
}

.item {
    background: #b91c1c;
    color: white;
    padding: 35px;
    border-radius: 12px;
    text-align: center;
}

footer {
    background: #450a0a;
    color: #fecdd3;
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>CSS calc() Function</h1>
    <p>Calculating sizes dynamically with CSS</p>
</header>

<div class="container">

    <div class="card">
        <h2>Dynamic Width</h2>

        <div class="example">
            Width is calculated using:
            <strong>calc(100% - 40px)</strong>
        </div>
    </div>

    <div class="card">
        <h2>Calculated Columns</h2>

        <div class="grid">
            <div class="item">50% - 10px</div>
            <div class="item">50% - 10px</div>
        </div>
    </div>

</div>

<footer>
    CSS calc() | Practical Program 74
</footer>

</body>
</html>
