<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Question 18 - CSS Animations</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            color: #450a0a;
        }

        header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            color: #ffe4e6;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        .section {
            padding: 50px 0;
        }

        .title {
            text-align: center;
            color: #991b1b;
            font-size: 30px;
            margin-bottom: 35px;
        }

        .animation-area {
            background: white;
            border: 2px solid #fecdd3;
            border-radius: 18px;
            padding: 45px 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(127, 29, 29, 0.1);
            overflow: hidden;
        }

        .animation-area h2 {
            text-align: center;
            color: #7f1d1d;
            margin-bottom: 30px;
        }

        .ball {
            width: 70px;
            height: 70px;
            background: #dc2626;
            border-radius: 50%;
            margin: auto;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-100px);
            }
        }

        .moving-box {
            width: 100px;
            height: 100px;
            background: #991b1b;
            border-radius: 15px;
            animation: moveBox 4s infinite alternate ease-in-out;
        }

        @keyframes moveBox {
            0% {
                transform: translateX(0) rotate(0deg);
            }

            50% {
                transform: translateX(350px) rotate(180deg);
            }

            100% {
                transform: translateX(700px) rotate(360deg);
            }
        }

        .pulse {
            width: 120px;
            height: 120px;
            background: #fda4af;
            color: #7f1d1d;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            animation: pulseEffect 1.5s infinite;
        }

        @keyframes pulseEffect {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.25);
                opacity: 0.6;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .text-animation {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #dc2626;
            animation: textEffect 2s infinite alternate;
        }

        @keyframes textEffect {
            from {
                letter-spacing: 2px;
                opacity: 0.4;
            }

            to {
                letter-spacing: 10px;
                opacity: 1;
            }
        }

        footer {
            background: #450a0a;
            color: #fecdd3;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 800px) {
            header h1 {
                font-size: 30px;
            }

            .moving-box {
                animation-name: mobileMove;
            }

            @keyframes mobileMove {
                0% {
                    transform: translateX(0) rotate(0deg);
                }

                100% {
                    transform: translateX(200px) rotate(360deg);
                }
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>CSS Animations</h1>
        <p>Interactive webpage demonstrating CSS keyframe animations</p>
    </header>

    <section class="section">

        <div class="container">

            <h2 class="title">Animation Examples</h2>

            <div class="animation-area">

                <h2>Bouncing Animation</h2>

                <div class="ball"></div>

            </div>

            <div class="animation-area">

                <h2>Moving & Rotating Animation</h2>

                <div class="moving-box"></div>

            </div>

            <div class="animation-area">

                <h2>Pulse Animation</h2>

                <div class="pulse">
                    PULSE
                </div>

            </div>

            <div class="animation-area">

                <h2>Text Animation</h2>

                <div class="text-animation">
                    CSS ANIMATION
                </div>

            </div>

        </div>

    </section>

    <footer>
        CSS Practical Program 18
    </footer>

</body>
</html>
