<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Question 13 - Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff1f2, #ffe4e6);
            min-height: 100vh;
            padding: 30px 15px;
            color: #450a0a;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(127, 29, 29, 0.18);
        }

        .header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .header p {
            color: #ffe4e6;
        }

        form {
            padding: 35px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #7f1d1d;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid #fecdd3;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            background: #fffafa;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #dc2626;
            background: white;
            box-shadow: 0 0 0 3px #ffe4e6;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .full-width {
            margin-bottom: 20px;
        }

        .gender-box {
            display: flex;
            gap: 25px;
            padding: 10px 0;
        }

        .gender-option {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .gender-option input {
            width: auto;
            accent-color: #dc2626;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 25px;
        }

        .terms input {
            width: auto;
            accent-color: #dc2626;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
            color: #64748b;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn {
            background: #991b1b;
            color: white;
        }

        .register-btn:hover {
            background: #7f1d1d;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: #ffe4e6;
            color: #991b1b;
        }

        .reset-btn:hover {
            background: #fecdd3;
        }

        footer {
            text-align: center;
            background: #450a0a;
            color: #fecdd3;
            padding: 18px;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            body {
                padding: 15px 10px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            form {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Student Registration</h1>
            <p>Create your student account</p>
        </div>

        <form>

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="Enter first name">
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Enter last name">
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter phone number">
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>

            </div>

            <div class="full-width">

                <label>Gender</label>

                <div class="gender-box">

                    <div class="gender-option">
                        <input type="radio" id="male" name="gender">
                        <label for="male">Male</label>
                    </div>

                    <div class="gender-option">
                        <input type="radio" id="female" name="gender">
                        <label for="female">Female</label>
                    </div>

                    <div class="gender-option">
                        <input type="radio" id="other" name="gender">
                        <label for="other">Other</label>
                    </div>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course">
                        <option>Select Course</option>
                        <option>Computer Science</option>
                        <option>Data Science</option>
                        <option>Artificial Intelligence</option>
                        <option>Information Technology</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>

                    <select id="year">
                        <option>Select Year</option>
                        <option>First Year</option>
                        <option>Second Year</option>
                        <option>Third Year</option>
                        <option>Fourth Year</option>
                    </select>
                </div>

            </div>

            <div class="full-width">

                <label for="address">Address</label>

                <textarea id="address" placeholder="Enter your address"></textarea>

            </div>

            <div class="terms">

                <input type="checkbox" id="terms">

                <label for="terms">
                    I agree to the terms and conditions
                </label>

            </div>

            <div class="buttons">

                <button type="submit" class="register-btn">
                    Register
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>

            </div>

        </form>

        <footer>
            CSS Practical Program 13
        </footer>

    </div>

</body>
</html>
