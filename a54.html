<!DOCTYPE html>
<html>
<head>
    <title>Q54 - Power of a Number</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 420px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
            color: #991b1b;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Power of a Number</h1>
</header>

<div class="card">

    <input type="number" id="base" placeholder="Enter base">
    <input type="number" id="exponent" placeholder="Enter exponent">

    <button onclick="calculatePower()">Calculate</button>

    <p id="result"></p>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function calculatePower() {
        const base = Number(document.getElementById("base").value);
        const exponent = Number(document.getElementById("exponent").value);

        const result = Math.pow(base, exponent);

        document.getElementById("result").textContent =
            base + " ^ " + exponent + " = " + result;
    }
</script>

</body>
</html>
