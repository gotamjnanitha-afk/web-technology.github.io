<!DOCTYPE html>
<html>
<head>
    <title>Q31 - Input Validation</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            text-align: center;
            padding: 25px;
        }

        form {
            width: 430px;
            max-width: 85%;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 7px 0 15px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Complete Input Validation</h1>
</header>

<form onsubmit="return validate()">

    <label>Name</label>
    <input type="text" id="name">

    <label>Email</label>
    <input type="text" id="email">

    <label>Phone</label>
    <input type="text" id="phone">

    <label>Password</label>
    <input type="password" id="password">

    <button type="submit">Validate</button>

    <p id="message"></p>
</form>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function validate() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value;

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phonePattern = /^[0-9]{10}$/;

        const message = document.getElementById("message");

        if (name === "") {
            message.textContent = "Enter your name.";
            return false;
        }

        if (!emailPattern.test(email)) {
            message.textContent = "Enter a valid email.";
            return false;
        }

        if (!phonePattern.test(phone)) {
            message.textContent = "Enter a valid 10-digit phone number.";
            return false;
        }

        if (password.length < 6) {
            message.textContent = "Password must contain at least 6 characters.";
            return false;
        }

        message.textContent = "All details are valid!";
        message.style.color = "green";

        return false;
    }
</script>

</body>
</html>
