<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date and Math Objects</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(127,29,29,.15);
        }
        h1 { color: #7f1d1d; }
        button {
            width: 100%;
            padding: 14px;
            background: #991b1b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #ffe4e6;
            border-radius: 10px;
            text-align: left;
            line-height: 2;
            color: #450a0a;
        }
        .back {
            display: block;
            margin-top: 20px;
            color: #991b1b;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Date and Math Objects</h1>

    <button onclick="showObjects()">Show Results</button>

    <div id="result"></div>

    <a href="index.html" class="back">← Back to JavaScript Programs</a>
</div>

<script>
function showObjects() {
    let today = new Date();

    let randomNumber = Math.random();
    let squareRoot = Math.sqrt(144);
    let power = Math.pow(2, 5);

    document.getElementById("result").innerHTML =
        "Current Date: " + today.toDateString() + "<br>" +
        "Current Time: " + today.toLocaleTimeString() + "<br>" +
        "Random Number: " + randomNumber.toFixed(3) + "<br>" +
        "Square Root of 144: " + squareRoot + "<br>" +
        "2 Power 5: " + power;
}
</script>

</body>
</html>
