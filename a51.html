<!DOCTYPE html>
<html>
<head>
    <title>Q51 - Armstrong Number</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 450px;
            max-width: 85%;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Armstrong Number</h1>
</header>

<div class="card">

    <input type="number" id="number" placeholder="Enter a number">

    <br>

    <button onclick="checkArmstrong()">Check</button>

    <p id="result"></p>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function checkArmstrong() {
        const number = Number(document.getElementById("number").value);

        if (number < 0 || !Number.isInteger(number)) {
            document.getElementById("result").textContent =
                "Enter a valid positive integer.";
            return;
        }

        const digits = String(number).split("");
        const power = digits.length;

        const sum = digits.reduce((total, digit) => {
            return total + Number(digit) ** power;
        }, 0);

        document.getElementById("result").textContent =
            sum === number
                ? number + " is an Armstrong number."
                : number + " is not an Armstrong number.";
    }
</script>

</body>
</html>
