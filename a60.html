<!DOCTYPE html>
<html>
<head>
    <title>Q60 - Common Elements</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 550px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            padding: 15px;
            background: #fff1f2;
            border-radius: 8px;
            font-weight: bold;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Common Elements</h1>
</header>

<div class="card">

    <input type="text" id="array1"
        placeholder="First array: 1,2,3,4">

    <input type="text" id="array2"
        placeholder="Second array: 3,4,5,6">

    <button onclick="findCommon()">Find Common Elements</button>

    <div id="result"></div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function findCommon() {
        const array1 = document.getElementById("array1").value
            .split(",")
            .map(item => item.trim());

        const array2 = document.getElementById("array2").value
            .split(",")
            .map(item => item.trim());

        const common = [...new Set(array1.filter(item => array2.includes(item)))];

        document.getElementById("result").textContent =
            common.length > 0
                ? "Common Elements: " + common.join(", ")
                : "No common elements found.";
    }
</script>

</body>
</html>
