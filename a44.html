<!DOCTYPE html>
<html>
<head>
    <title>Q44 - Display API Data</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 700px;
            max-width: 85%;
            margin: 40px auto;
        }

        button {
            display: block;
            margin: auto;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .user {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 5px 15px #fecdd3;
        }

        .user h3 {
            color: #991b1b;
        }

        a {
            display: block;
            text-align: center;
            color: #991b1b;
            margin: 25px;
        }
    </style>
</head>
<body>

<header>
    <h1>API User Data</h1>
</header>

<div class="container">

    <button onclick="loadUsers()">Load Users</button>

    <div id="users"></div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function loadUsers() {
        const usersContainer = document.getElementById("users");

        usersContainer.innerHTML = "Loading...";

        fetch("https://jsonplaceholder.typicode.com/users")
            .then(response => response.json())
            .then(users => {
                usersContainer.innerHTML = "";

                users.slice(0, 5).forEach(user => {
                    usersContainer.innerHTML += `
                        <div class="user">
                            <h3>${user.name}</h3>
                            <p><strong>Email:</strong> ${user.email}</p>
                            <p><strong>Phone:</strong> ${user.phone}</p>
                            <p><strong>City:</strong> ${user.address.city}</p>
                        </div>
                    `;
                });
            })
            .catch(() => {
                usersContainer.textContent = "Unable to load data.";
            });
    }
</script>

</body>
</html>
