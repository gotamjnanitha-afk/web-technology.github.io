<!DOCTYPE html>
<html>
<head>
    <title>Q47 - Interactive Webpage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #450a0a;
            padding: 12px;
            text-align: center;
        }

        nav button {
            margin: 5px;
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #fecdd3;
            color: #450a0a;
            cursor: pointer;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: white;
        }

        .hero h2 {
            color: #991b1b;
            font-size: 35px;
        }

        .content {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #fecdd3;
            text-align: center;
        }

        .card button {
            padding: 10px 20px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        footer {
            margin-top: 40px;
            background: #7f1d1d;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>My Interactive Website</h1>
    <p>HTML • CSS • JavaScript</p>
</header>

<nav>
    <button onclick="showMessage('Welcome Home!')">Home</button>
    <button onclick="showMessage('About Section')">About</button>
    <button onclick="showMessage('Contact Section')">Contact</button>
</nav>

<section class="hero">
    <h2>Welcome!</h2>
    <p id="message">Click a button to interact with the webpage.</p>
</section>

<section class="content">

    <div class="card">
        <h2>Counter</h2>
        <h3 id="count">0</h3>
        <button onclick="increase()">Increase</button>
    </div>

    <div class="card">
        <h2>Greeting</h2>
        <p id="greeting">Click below</p>
        <button onclick="greet()">Greet Me</button>
    </div>

    <div class="card">
        <h2>Theme</h2>
        <p>Change the background.</p>
        <button onclick="changeTheme()">Change</button>
    </div>

</section>

<footer>
    <p>Interactive JavaScript Webpage</p>
</footer>

<script>
    let count = 0;

    function showMessage(text) {
        document.getElementById("message").textContent = text;
    }

    function increase() {
        count++;
        document.getElementById("count").textContent = count;
    }

    function greet() {
        document.getElementById("greeting").textContent =
            "Hello! Welcome to my website 👋";
    }

    function changeTheme() {
        document.body.style.background =
            document.body.style.background === "rgb(255, 228, 230)"
                ? "#fff1f2"
                : "#ffe4e6";
    }
</script>

</body>
</html>
