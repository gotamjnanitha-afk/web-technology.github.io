<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - Hello World</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 50px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
            border-top: 6px solid #991b1b;
        }

        h1 {
            color: #7f1d1d;
            margin-bottom: 25px;
        }

        #output {
            font-size: 32px;
            font-weight: bold;
            color: #dc2626;
            padding: 25px;
            background: #ffe4e6;
            border-radius: 12px;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 22px;
            background: #991b1b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back:hover {
            background: #7f1d1d;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>JavaScript Hello World</h1>

        <div id="output"></div>

        <a href="index.html" class="back">← Back to JavaScript Programs</a>
    </div>

    <script>
        document.getElementById("output").textContent = "Hello World";
    </script>

</body>
</html>
