<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Question 1</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            color: #450a0a;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
        }

        header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            color: #ffe4e6;
            font-size: 17px;
        }

        main {
            padding: 40px;
            display: grid;
            gap: 25px;
        }

        .card {
            padding: 28px;
            border-radius: 15px;
            background: #fff1f2;
            border-left: 6px solid #b91c1c;
        }

        .card h2 {
            color: #991b1b;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 17px;
            line-height: 1.7;
        }

        .internal-box {
            background: #ffe4e6;
            color: #7f1d1d;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #fda4af;
            font-size: 18px;
            font-weight: bold;
        }

        .external-box {
            background: #7f1d1d;
            color: white;
            padding: 20px;
            border-radius: 12px;
            border: 3px solid #dc2626;
            font-size: 18px;
        }

        footer {
            background: #450a0a;
            color: #fecdd3;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            header h1 {
                font-size: 28px;
            }

            main {
                padding: 20px 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>CSS Styling</h1>
            <p>Inline, Internal and External CSS</p>
        </header>

        <main>

            <section class="card">
                <h2>1. Inline CSS</h2>

                <p style="color: #dc2626; font-size: 21px; font-weight: bold;">
                    This text is styled using Inline CSS.
                </p>
            </section>

            <section class="card">
                <h2>2. Internal CSS</h2>

                <div class="internal-box">
                    This box is styled using Internal CSS.
                </div>
            </section>

            <section class="card">
                <h2>3. External CSS</h2>

                <div class="external-box">
                    This section represents styling applied using an External CSS file.
                </div>
            </section>

        </main>

        <footer>
            CSS Practical Program 01
        </footer>

    </div>

</body>
</html>
