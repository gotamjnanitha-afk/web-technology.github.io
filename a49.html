<!DOCTYPE html>
<html>
<head>
    <title>Q49 - GCD</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 400px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
            color: #991b1b;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Greatest Common Divisor</h1>
</header>

<div class="card">

    <input type="number" id="a" placeholder="Enter first number">
    <input type="number" id="b" placeholder="Enter second number">

    <button onclick="findGCD()">Find GCD</button>

    <p id="result"></p>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function findGCD() {
        let a = Math.abs(Number(document.getElementById("a").value));
        let b = Math.abs(Number(document.getElementById("b").value));

        while (b !== 0) {
            let remainder = a % b;
            a = b;
            b = remainder;
        }

        document.getElementById("result").textContent = "GCD = " + a;
    }
</script>

</body>
</html>
