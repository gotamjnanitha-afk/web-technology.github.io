<!DOCTYPE html>
<html>
<head>
    <title>Q48 - Swap Two Numbers</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 400px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 10px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Swap Two Numbers</h1>
</header>

<div class="card">

    <input type="number" id="first" placeholder="First number">
    <input type="number" id="second" placeholder="Second number">

    <button onclick="swapNumbers()">Swap</button>

    <p id="result"></p>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function swapNumbers() {
        let first = Number(document.getElementById("first").value);
        let second = Number(document.getElementById("second").value);

        [first, second] = [second, first];

        document.getElementById("result").textContent =
            "After swapping: First = " + first +
            ", Second = " + second;
    }
</script>

</body>
</html>
