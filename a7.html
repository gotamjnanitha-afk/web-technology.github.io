<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iframe Example</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            color: #475569;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
        }

        .header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: white;
            text-align: center;
            padding: 45px 25px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #ffe4e6;
            font-size: 16px;
        }

        .content {
            padding: 40px;
        }

        .iframe-section {
            background: #fff1f2;
            border-left: 5px solid #dc2626;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        h2 {
            color: #991b1b;
            font-size: 25px;
            margin-bottom: 20px;
        }

        .iframe-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(127, 29, 29, 0.1);
        }

        iframe {
            width: 100%;
            height: 500px;
            border: 3px solid #fecdd3;
            border-radius: 10px;
            background: #ffffff;
        }

        .footer {
            background: #450a0a;
            color: #fecdd3;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 25px 15px;
            }

            .iframe-section {
                padding: 20px 15px;
            }

            iframe {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>My Iframe Webpage</h1>
            <p>Embedding an External Webpage</p>
        </div>

        <div class="content">

            <div class="iframe-section">

                <h2>Wikipedia</h2>

                <div class="iframe-box">

                    <iframe
                        src="https://www.wikipedia.org"
                        title="Wikipedia Website">
                    </iframe>

                </div>

            </div>

        </div>

        <div class="footer">
            HTML Practical &nbsp; | &nbsp; Iframe Example
        </div>

    </div>

</body>
</html>
