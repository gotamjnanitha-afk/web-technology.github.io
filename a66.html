<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #fff5f6;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            background: white;
            padding: 45px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.12);
        }

        h1 {
            color: #7f1d1d;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 40px;
        }

        .examples {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .box {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            background: #b91c1c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .color {
            transition: background 0.5s ease;
        }

        .color:hover {
            background: #450a0a;
        }

        .size {
            transition: transform 0.5s ease;
        }

        .size:hover {
            transform: scale(1.15);
        }

        .move {
            transition: transform 0.6s ease;
        }

        .move:hover {
            transform: translateY(-25px);
        }

        .rotate {
            transition: transform 0.6s ease;
        }

        .rotate:hover {
            transform: rotate(15deg);
        }

        .multiple {
            transition:
                transform 0.5s ease,
                background 0.5s ease,
                border-radius 0.5s ease;
        }

        .multiple:hover {
            transform: scale(1.1) rotate(5deg);
            background: #991b1b;
            border-radius: 50%;
        }

        .note {
            margin-top: 35px;
            padding: 15px;
            background: #fff1f2;
            color: #991b1b;
            border-radius: 10px;
        }

        @media (max-width: 650px) {
            .examples {
                gap: 20px;
            }

            .box {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS Transitions</h1>

        <p class="subtitle">
            Hover over each box to see different transition effects.
        </p>

        <div class="examples">

            <div class="box color">
                Color
            </div>

            <div class="box size">
                Scale
            </div>

            <div class="box move">
                Move
            </div>

            <div class="box rotate">
                Rotate
            </div>

            <div class="box multiple">
                Multiple
            </div>

        </div>

        <div class="note">
            CSS transitions create smooth changes between two states.
        </div>

    </div>

</body>
</html>
