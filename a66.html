<!DOCTYPE html>
<html>
<head>
    <title>Q66 - Regular Expression</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 550px;
            max-width: 85%;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            padding: 15px;
            background: #fff1f2;
            border-radius: 8px;
            font-weight: bold;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Regular Expression</h1>
</header>

<div class="card">

    <p>Check whether the input contains only letters and numbers.</p>

    <input type="text" id="text" placeholder="Example: Student123">

    <br>

    <button onclick="validateText()">Validate</button>

    <div id="result"></div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function validateText() {
        const text = document.getElementById("text").value;

        const pattern = /^[A-Za-z0-9]+$/;

        const valid = pattern.test(text);

        document.getElementById("result").textContent =
            valid
                ? "Valid input."
                : "Invalid input. Use only letters and numbers.";
    }
</script>

</body>
</html>
