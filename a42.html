<!DOCTYPE html>
<html>
<head>
    <title>Q42 - Callbacks Promises Async Await</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
            text-align: center;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 650px;
            max-width: 85%;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        .result {
            padding: 18px;
            margin: 12px 0;
            background: #fff1f2;
            border-left: 5px solid #b91c1c;
            border-radius: 8px;
            text-align: left;
        }

        button {
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Asynchronous JavaScript</h1>
</header>

<div class="card">

    <button onclick="runExamples()">Run Examples</button>

    <div class="result" id="callback">Callback: —</div>
    <div class="result" id="promise">Promise: —</div>
    <div class="result" id="async">Async/Await: —</div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function callbackExample(callback) {
        setTimeout(() => {
            callback("Callback executed successfully!");
        }, 500);
    }

    function promiseExample() {
        return new Promise((resolve) => {
            setTimeout(() => {
                resolve("Promise resolved successfully!");
            }, 1000);
        });
    }

    async function asyncExample() {
        const result = await promiseExample();
        return "Async/Await: " + result;
    }

    function runExamples() {
        callbackExample((message) => {
            document.getElementById("callback").textContent =
                message;
        });

        promiseExample().then((message) => {
            document.getElementById("promise").textContent =
                message;
        });

        asyncExample().then((message) => {
            document.getElementById("async").textContent =
                message;
        });
    }
</script>

</body>
</html>
