<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Click Event</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 550px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(127,29,29,.15);
        }
        h1 { color: #7f1d1d; }
        button {
            padding: 15px 30px;
            background: #991b1b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
        }
        #result {
            margin-top: 25px;
            padding: 18px;
            background: #ffe4e6;
            border-radius: 10px;
            color: #991b1b;
            font-weight: bold;
        }
        .back {
            display: block;
            margin-top: 20px;
            color: #991b1b;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Button Click Event</h1>

    <button onclick="buttonClicked()">Click Me</button>

    <div id="result">Waiting for button click...</div>

    <a href="index.html" class="back">← Back to JavaScript Programs</a>
</div>

<script>
function buttonClicked() {
    document.getElementById("result").textContent =
        "Button was clicked successfully!";
}
</script>

</body>
</html>
