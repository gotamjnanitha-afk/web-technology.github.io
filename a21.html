<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Text Using JavaScript</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(127,29,29,.15);
        }
        h1 { color: #7f1d1d; }
        #message {
            margin: 25px 0;
            padding: 20px;
            background: #ffe4e6;
            border-radius: 10px;
            font-size: 24px;
            color: #991b1b;
            font-weight: bold;
        }
        button {
            padding: 14px 25px;
            background: #991b1b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .back {
            display: block;
            margin-top: 20px;
            color: #991b1b;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Change Text Using JavaScript</h1>

    <div id="message">Original Text</div>

    <button onclick="changeText()">Change Text</button>

    <a href="index.html" class="back">← Back to JavaScript Programs</a>
</div>

<script>
function changeText() {
    document.getElementById("message").textContent =
        "Text Changed Successfully!";
}
</script>

</body>
</html>
