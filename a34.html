<!DOCTYPE html>
<html>
<head>
    <title>Q34 - Counter</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .counter {
            width: 350px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        #count {
            font-size: 60px;
            font-weight: bold;
            color: #b91c1c;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #b91c1c;
            color: white;
            cursor: pointer;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Counter</h1>
</header>

<div class="counter">

    <div id="count">0</div>

    <button onclick="decrease()">−</button>
    <button onclick="reset()">Reset</button>
    <button onclick="increase()">+</button>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    let count = 0;

    function increase() {
        count++;
        update();
    }

    function decrease() {
        count--;
        update();
    }

    function reset() {
        count = 0;
        update();
    }

    function update() {
        document.getElementById("count").textContent = count;
    }
</script>

</body>
</html>
