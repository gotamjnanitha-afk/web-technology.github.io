<!DOCTYPE html>
<html>
<head>
    <title>Q45 - LocalStorage</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
            text-align: center;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 450px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 10px 5px;
            padding: 12px 20px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #display {
            margin-top: 20px;
            padding: 15px;
            background: #fff1f2;
            border-radius: 8px;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>LocalStorage</h1>
</header>

<div class="card">

    <input type="text" id="name" placeholder="Enter your name">

    <br>

    <button onclick="saveData()">Save</button>
    <button onclick="loadData()">Load</button>
    <button onclick="clearData()">Clear</button>

    <div id="display">No data loaded.</div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function saveData() {
        const name = document.getElementById("name").value;

        localStorage.setItem("studentName", name);

        document.getElementById("display").textContent =
            "Data saved successfully!";
    }

    function loadData() {
        const name = localStorage.getItem("studentName");

        if (name) {
            document.getElementById("display").textContent =
                "Saved Name: " + name;
        } else {
            document.getElementById("display").textContent =
                "No saved data found.";
        }
    }

    function clearData() {
        localStorage.removeItem("studentName");

        document.getElementById("display").textContent =
            "Saved data cleared.";
    }
</script>

</body>
</html>
