<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Functions</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 550px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(127,29,29,.15);
        }
        h1 { color: #7f1d1d; }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #fecdd3;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background: #991b1b;
            color: white;
            border: none;
            border-radius: 8px;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #ffe4e6;
            border-radius: 10px;
            color: #991b1b;
            line-height: 2;
            font-weight: bold;
        }
        .back {
            display: block;
            margin-top: 20px;
            color: #991b1b;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Arrow Functions</h1>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <a href="index.html" class="back">← Back to JavaScript Programs</a>
</div>

<script>
const add = (a, b) => a + b;
const subtract = (a, b) => a - b;
const multiply = (a, b) => a * b;

function calculate() {
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    document.getElementById("result").innerHTML =
        "Addition: " + add(a, b) + "<br>" +
        "Subtraction: " + subtract(a, b) + "<br>" +
        "Multiplication: " + multiply(a, b);
}
</script>

</body>
</html>
