<!DOCTYPE html>
<html>
<head>
    <title>Q30 - Form Validation</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            text-align: center;
            padding: 25px;
        }

        form {
            width: 400px;
            max-width: 85%;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Form Validation</h1>
</header>

<form onsubmit="return validateForm()">

    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email">

    <button type="submit">Submit</button>

    <p id="message"></p>
</form>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function validateForm() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const message = document.getElementById("message");

        if (name === "" || email === "") {
            message.textContent = "Please fill in all fields.";
            message.style.color = "#b91c1c";
            return false;
        }

        message.textContent = "Form submitted successfully!";
        message.style.color = "green";

        return false;
    }
</script>

</body>
</html>
