<!DOCTYPE html>
<html>
<head>
    <title>Q56 - Second Largest Array Element</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 500px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            color: #991b1b;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Second Largest Element</h1>
</header>

<div class="card">

    <input type="text" id="array" placeholder="Example: 10, 25, 5, 40, 30">

    <br>

    <button onclick="findSecondLargest()">Find</button>

    <p id="result"></p>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function findSecondLargest() {
        const input = document.getElementById("array").value;

        const numbers = input
            .split(",")
            .map(Number)
            .filter(number => !isNaN(number));

        const uniqueNumbers = [...new Set(numbers)];

        if (uniqueNumbers.length < 2) {
            document.getElementById("result").textContent =
                "Enter at least two different numbers.";
            return;
        }

        uniqueNumbers.sort((a, b) => b - a);

        document.getElementById("result").textContent =
            "Second Largest = " + uniqueNumbers[1];
    }
</script>

</body>
</html>
