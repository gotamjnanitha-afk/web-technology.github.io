<!DOCTYPE html>
<html>
<head>
    <title>Q35 - Stopwatch</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .stopwatch {
            width: 350px;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        #display {
            font-size: 45px;
            font-weight: bold;
            color: #b91c1c;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #b91c1c;
            color: white;
            cursor: pointer;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Stopwatch</h1>
</header>

<div class="stopwatch">

    <div id="display">00:00:00</div>

    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    let seconds = 0;
    let timer = null;

    function updateDisplay() {
        const hours = String(Math.floor(seconds / 3600)).padStart(2, "0");
        const minutes = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
        const secs = String(seconds % 60).padStart(2, "0");

        document.getElementById("display").textContent =
            `${hours}:${minutes}:${secs}`;
    }

    function start() {
        if (timer !== null) {
            return;
        }

        timer = setInterval(() => {
            seconds++;
            updateDisplay();
        }, 1000);
    }

    function stop() {
        clearInterval(timer);
        timer = null;
    }

    function reset() {
        stop();
        seconds = 0;
        updateDisplay();
    }
</script>

</body>
</html>
