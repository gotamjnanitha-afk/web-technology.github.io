<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Example</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
        }

        .main-container {
            max-width: 1000px;
            margin: 50px auto;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
        }

        .header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: #ffffff;
            text-align: center;
            padding: 45px 20px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            color: #ffe4e6;
            margin: 0;
        }

        .content {
            padding: 40px;
        }

        .content-box {
            background: #fff1f2;
            border-left: 5px solid #dc2626;
            padding: 30px;
            border-radius: 12px;
        }

        .content-box h2 {
            color: #991b1b;
            margin-bottom: 20px;
        }

        .card {
            border: 1px solid #fecdd3;
            box-shadow: 0 5px 15px rgba(127, 29, 29, 0.1);
        }

        .card-title {
            color: #991b1b;
        }

        .footer {
            background: #450a0a;
            color: #fecdd3;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .btn-success {
            background-color: #991b1b;
            border-color: #991b1b;
        }

        .btn-success:hover {
            background-color: #7f1d1d;
            border-color: #7f1d1d;
        }

        .btn-primary {
            background-color: #dc2626;
            border-color: #dc2626;
        }

        .btn-primary:hover {
            background-color: #991b1b;
            border-color: #991b1b;
        }

        .text-primary {
            color: #991b1b !important;
        }

        .alert-info {
            background-color: #ffe4e6;
            border-color: #fecdd3;
            color: #7f1d1d;
        }

        @media (max-width: 600px) {
            .main-container {
                margin: 20px 10px;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 25px 15px;
            }

            .content-box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">

        <div class="header">
            <h1>Bootstrap Webpage</h1>
            <p>Bootstrap Components Example</p>
        </div>

        <div class="content">

            <div class="content-box">

                <h2 class="text-primary">Bootstrap Webpage</h2>

                <p class="lead">
                    This webpage uses Bootstrap components.
                </p>

                <button class="btn btn-success">
                    Click Me
                </button>

                <div class="alert alert-info mt-3">
                    Welcome to Bootstrap!
                </div>

                <div class="card mt-3" style="width: 18rem;">

                    <div class="card-body">

                        <h5 class="card-title">
                            Student Card
                        </h5>

                        <p class="card-text">
                            This is a Bootstrap card.
                        </p>

                        <button class="btn btn-primary">
                            Read More
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <div class="footer">
            CSS Practical &nbsp; | &nbsp; Bootstrap Example
        </div>

    </div>

</body>
</html>
