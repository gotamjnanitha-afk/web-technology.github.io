<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest of Three Numbers</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 550px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
            border-top: 6px solid #991b1b;
        }

        h1 {
            color: #7f1d1d;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border: 1px solid #fecdd3;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #991b1b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #7f1d1d;
        }

        #result {
            margin-top: 20px;
            padding: 18px;
            background: #ffe4e6;
            color: #991b1b;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #991b1b;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Largest of Three Numbers</h1>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <input type="number" id="num3" placeholder="Enter third number">

    <button onclick="findLargest()">Find Largest</button>

    <div id="result"></div>

    <a href="index.html" class="back">← Back to JavaScript Programs</a>
</div>

<script>
    function findLargest() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);
        let c = Number(document.getElementById("num3").value);

        let largest = Math.max(a, b, c);

        document.getElementById("result").textContent =
            "Largest Number: " + largest;
    }
</script>

</body>
</html>
