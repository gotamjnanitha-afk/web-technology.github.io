<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Table</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            color: #475569;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
        }

        .header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: white;
            text-align: center;
            padding: 45px 25px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #ffe4e6;
            font-size: 16px;
        }

        .content {
            padding: 40px;
        }

        .table-box {
            background: #fff1f2;
            border-left: 5px solid #dc2626;
            padding: 25px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #991b1b;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            font-size: 16px;
        }

        td {
            padding: 14px;
            text-align: center;
            border: 1px solid #fecdd3;
            font-size: 16px;
        }

        tr:nth-child(even) td {
            background: #fff5f6;
        }

        tr:hover td {
            background: #ffe4e6;
        }

        .total {
            font-weight: bold;
            color: #991b1b;
        }

        .footer {
            background: #450a0a;
            color: #fecdd3;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 25px 15px;
            }

            .table-box {
                padding: 15px;
            }

            th,
            td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Student Details</h1>
            <p>Student Information Table</p>
        </div>

        <div class="content">

            <div class="table-box">

                <table border="1">

                    <tr>
                        <th colspan="3">Student Information</th>
                    </tr>

                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Course</th>
                    </tr>

                    <tr>
                        <td>Rahul</td>
                        <td>20</td>
                        <td>CSE</td>
                    </tr>

                    <tr>
                        <td>Priya</td>
                        <td>19</td>
                        <td>Data Science</td>
                    </tr>

                    <tr>
                        <td rowspan="2" class="total">Total Students</td>
                        <td colspan="2" class="total">2</td>
                    </tr>

                </table>

            </div>

        </div>

        <div class="footer">
            HTML Practical &nbsp; | &nbsp; Student Table
        </div>

    </div>

</body>
</html>
