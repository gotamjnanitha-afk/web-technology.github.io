<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse a Number</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
        }

        h1 {
            color: #7f1d1d;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid #fecdd3;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #991b1b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 18px;
            background: #ffe4e6;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #991b1b;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #991b1b;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Reverse a Number</h1>

    <input type="number" id="number" placeholder="Enter a number">

    <button onclick="reverseNumber()">Reverse Number</button>

    <div id="result"></div>

    <a href="index.html" class="back">← Back to JavaScript Programs</a>
</div>

<script>
    function reverseNumber() {
        let number = document.getElementById("number").value;
        let reversed = number.split("").reverse().join("");

        document.getElementById("result").textContent =
            "Reversed Number: " + reversed;
    }
</script>

</body>
</html>
