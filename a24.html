<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Hide Element</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(127,29,29,.15);
        }
        h1 { color: #7f1d1d; }
        #message {
            margin: 25px 0;
            padding: 25px;
            background: #ffe4e6;
            border-radius: 10px;
            color: #991b1b;
            font-size: 20px;
        }
        button {
            padding: 12px 22px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #991b1b;
            color: white;
            cursor: pointer;
        }
        .back {
            display: block;
            margin-top: 20px;
            color: #991b1b;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Show / Hide Element</h1>

    <div id="message">
        This element can be shown or hidden.
    </div>

    <button onclick="showElement()">Show</button>
    <button onclick="hideElement()">Hide</button>

    <a href="index.html" class="back">← Back to JavaScript Programs</a>
</div>

<script>
function showElement() {
    document.getElementById("message").style.display = "block";
}

function hideElement() {
    document.getElementById("message").style.display = "none";
}
</script>

</body>
</html>
