<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Properties</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            color: #475569;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
        }

        header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: #ffffff;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            color: #ffe4e6;
            font-size: 16px;
        }

        main {
            padding: 40px;
        }

        .content {
            background: #fff1f2;
            border-left: 5px solid #dc2626;
            padding: 25px;
            border-radius: 12px;
        }

        .content h2 {
            color: #991b1b;
            margin-bottom: 20px;
        }

        .example {
            color: #166534;
            font-size: 20px;
            margin: 20px;
            padding: 15px;
            border: 2px solid #991b1b;
            background: #ffffff;
            border-radius: 8px;
        }

        .box {
            background-color: #fecdd3;
            color: #7f1d1d;
            padding: 20px;
            margin: 30px;
            border: 3px solid #dc2626;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }

        #special {
            color: #991b1b;
            background: #ffe4e6;
            font-size: 20px;
            margin: 20px;
            padding: 15px;
            border: 2px solid #b91c1c;
            border-radius: 8px;
            font-weight: bold;
        }

        footer {
            background: #450a0a;
            color: #fecdd3;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            header h1 {
                font-size: 28px;
            }

            main {
                padding: 25px 15px;
            }

            .content {
                padding: 20px;
            }

            .example,
            .box,
            #special {
                margin: 15px 5px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>CSS Selectors</h1>
            <p>CSS Properties, Margin, Padding and Borders</p>
        </header>

        <main>

            <div class="content">

                <h2>CSS Properties Example</h2>

                <p class="example">
                    This demonstrates margin, padding and border.
                </p>

                <div class="box">
                    This is a class selector.
                </div>

                <p id="special">
                    This is an ID selector.
                </p>

            </div>

        </main>

        <footer>
            CSS Practical &nbsp; | &nbsp; CSS Selectors
        </footer>

    </div>

</body>
</html>
