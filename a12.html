<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest and Smallest Array Element</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(127,29,29,.15);
        }
        h1 { color: #7f1d1d; }
        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid #fecdd3;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #991b1b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #ffe4e6;
            border-radius: 10px;
            line-height: 2;
            font-weight: bold;
            color: #991b1b;
        }
        .back {
            display: block;
            margin-top: 20px;
            color: #991b1b;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Largest and Smallest</h1>
    <input type="text" id="array" placeholder="Example: 10, 25, 5, 40, 15">
    <button onclick="findValues()">Find Values</button>
    <div id="result"></div>
    <a href="index.html" class="back">← Back to JavaScript Programs</a>
</div>

<script>
function findValues() {
    let values = document.getElementById("array").value
        .split(",")
        .map(Number);

    let largest = Math.max(...values);
    let smallest = Math.min(...values);

    document.getElementById("result").innerHTML =
        "Largest: " + largest + "<br>" +
        "Smallest: " + smallest;
}
</script>

</body>
</html>
