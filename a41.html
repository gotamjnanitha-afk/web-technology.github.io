<!DOCTYPE html>
<html>
<head>
    <title>Q41 - Inheritance</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
            text-align: center;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 450px;
            max-width: 85%;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        .result {
            padding: 15px;
            margin: 12px 0;
            background: #fff1f2;
            border-radius: 8px;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>JavaScript Inheritance</h1>
</header>

<div class="card">
    <div class="result" id="name"></div>
    <div class="result" id="course"></div>
    <div class="result" id="role"></div>
    <div class="result" id="message"></div>
</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    class Person {
        constructor(name) {
            this.name = name;
        }

        introduce() {
            return "Hello, I am " + this.name;
        }
    }

    class Student extends Person {
        constructor(name, course) {
            super(name);
            this.course = course;
        }

        getCourse() {
            return "Course: " + this.course;
        }
    }

    const student = new Student(
        "Jnanitha",
        "Computing and Data Science"
    );

    document.getElementById("name").textContent =
        "Name: " + student.name;

    document.getElementById("course").textContent =
        student.getCourse();

    document.getElementById("role").textContent =
        "Role: Student";

    document.getElementById("message").textContent =
        student.introduce();
</script>

</body>
</html>
