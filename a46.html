<!DOCTYPE html>
<html>
<head>
    <title>Q46 - Responsive Login Validation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #450a0a;
        }

        .login {
            width: 400px;
            max-width: 90%;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        h1 {
            text-align: center;
            color: #7f1d1d;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0 15px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #991b1b;
        }

        @media (max-width: 500px) {
            .login {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

<div class="login">

    <h1>Login</h1>

    <form onsubmit="return login()">

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email">

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <button type="submit">Login</button>

        <p id="message"></p>

    </form>

    <a href="index.html">← Back to JavaScript Programs</a>

</div>

<script>
    function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        if (email === "" || password === "") {
            message.textContent = "Please fill all fields.";
            message.style.color = "#b91c1c";
            return false;
        }

        if (password.length < 6) {
            message.textContent = "Password must contain at least 6 characters.";
            message.style.color = "#b91c1c";
            return false;
        }

        message.textContent = "Login successful!";
        message.style.color = "green";

        return false;
    }
</script>

</body>
</html>
