<!DOCTYPE html>
<html>
<head>
    <title>Q38 - ES6 Features</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .card {
            width: 700px;
            max-width: 85%;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        .item {
            padding: 15px;
            margin: 10px 0;
            background: #fff1f2;
            border-left: 5px solid #b91c1c;
            border-radius: 8px;
        }

        a {
            display: block;
            text-align: center;
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>ES6 Features</h1>
</header>

<div class="card">

    <div class="item" id="variables"></div>
    <div class="item" id="arrow"></div>
    <div class="item" id="template"></div>
    <div class="item" id="destructuring"></div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    const name = "Jnanitha";
    let age = 20;

    const add = (a, b) => a + b;

    const message = `Hello ${name}, your age is ${age}.`;

    const student = {
        name: "Jnanitha",
        course: "Data Science"
    };

    const { course } = student;

    document.getElementById("variables").textContent =
        `let / const: ${name}, ${age}`;

    document.getElementById("arrow").textContent =
        `Arrow Function: 10 + 20 = ${add(10, 20)}`;

    document.getElementById("template").textContent =
        `Template Literal: ${message}`;

    document.getElementById("destructuring").textContent =
        `Destructuring: Course = ${course}`;
</script>

</body>
</html>
