<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Question 22 - Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 950px;
            min-height: 580px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .welcome-section {
            background: linear-gradient(145deg, #7f1d1d, #dc2626);
            color: white;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome-section .logo {
            width: 70px;
            height: 70px;
            background: white;
            color: #991b1b;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .welcome-section h1 {
            font-size: 42px;
            margin-bottom: 18px;
        }

        .welcome-section p {
            color: #ffe4e6;
            line-height: 1.8;
            font-size: 16px;
        }

        .login-section {
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-section h2 {
            color: #7f1d1d;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #450a0a;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #fecdd3;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px #ffe4e6;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #64748b;
        }

        .options a {
            color: #991b1b;
            text-decoration: none;
            font-weight: bold;
        }

        .options a:hover {
            color: #dc2626;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #991b1b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #fecdd3;
        }

        .signup {
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .signup a {
            color: #991b1b;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            color: #dc2626;
        }

        @media (max-width: 750px) {

            .login-container {
                grid-template-columns: 1fr;
                max-width: 500px;
            }

            .welcome-section {
                padding: 35px;
                text-align: center;
                align-items: center;
            }

            .welcome-section h1 {
                font-size: 34px;
            }

            .welcome-section .logo {
                margin-bottom: 20px;
            }

            .login-section {
                padding: 40px 35px;
            }
        }

        @media (max-width: 450px) {

            body {
                padding: 10px;
            }

            .welcome-section {
                padding: 30px 20px;
            }

            .login-section {
                padding: 30px 20px;
            }

            .welcome-section h1 {
                font-size: 28px;
            }

            .login-section h2 {
                font-size: 27px;
            }

            .options {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <section class="welcome-section">

            <div class="logo">W</div>

            <h1>Welcome Back!</h1>

            <p>
                Sign in to continue to your account and access
                your personalized dashboard, projects and services.
            </p>

        </section>

        <section class="login-section">

            <h2>Login</h2>

            <p class="subtitle">
                Enter your details to access your account.
            </p>

            <form>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >
                </div>

                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit" class="login-button">
                    Sign In
                </button>

            </form>

            <div class="divider">
                OR
            </div>

            <p class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </section>

    </div>

</body>
</html>
