<!DOCTYPE html>
<html>
<head>
    <title>Q63 - Vowels and Consonants</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 500px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .result {
            padding: 15px;
            margin: 10px;
            background: #fff1f2;
            border-radius: 8px;
            font-weight: bold;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Vowels and Consonants</h1>
</header>

<div class="card">

    <input type="text" id="text" placeholder="Enter a string">

    <br>

    <button onclick="countLetters()">Count</button>

    <div class="result" id="vowels"></div>
    <div class="result" id="consonants"></div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function countLetters() {
        const text = document.getElementById("text").value.toLowerCase();

        let vowels = 0;
        let consonants = 0;

        for (const character of text) {
            if (/[a-z]/.test(character)) {
                if ("aeiou".includes(character)) {
                    vowels++;
                } else {
                    consonants++;
                }
            }
        }

        document.getElementById("vowels").textContent =
            "Vowels: " + vowels;

        document.getElementById("consonants").textContent =
            "Consonants: " + consonants;
    }
</script>

</body>
</html>
