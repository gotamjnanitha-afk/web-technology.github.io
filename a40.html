<!DOCTYPE html>
<html>
<head>
    <title>Q40 - Classes and Objects</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
            text-align: center;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .profile {
            width: 400px;
            max-width: 85%;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: #fecdd3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h2 {
            color: #991b1b;
        }

        .info {
            padding: 12px;
            margin: 8px;
            background: #fff1f2;
            border-radius: 8px;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Classes and Objects</h1>
</header>

<div class="profile">

    <div class="avatar">👩‍💻</div>

    <h2 id="name"></h2>

    <div class="info" id="course"></div>
    <div class="info" id="year"></div>
    <div class="info" id="message"></div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    class Student {
        constructor(name, course, year) {
            this.name = name;
            this.course = course;
            this.year = year;
        }

        getDetails() {
            return `Welcome, ${this.name}!`;
        }
    }

    const student = new Student(
        "Jnanitha",
        "Computing and Data Science",
        "2nd Year"
    );

    document.getElementById("name").textContent = student.name;
    document.getElementById("course").textContent = "Course: " + student.course;
    document.getElementById("year").textContent = "Year: " + student.year;
    document.getElementById("message").textContent = student.getDetails();
</script>

</body>
</html>
