<!DOCTYPE html>
<html>
<head>
    <title>Q55 - Count Digits</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 420px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
            color: #991b1b;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Count Digits</h1>
</header>

<div class="card">

    <input type="number" id="number" placeholder="Enter a number">

    <br>

    <button onclick="countDigits()">Count</button>

    <p id="result"></p>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function countDigits() {
        const number = Number(document.getElementById("number").value);

        const count = Math.abs(number).toString().replace(".", "").length;

        document.getElementById("result").textContent =
            "Number of digits: " + count;
    }
</script>

</body>
</html>
