<!DOCTYPE html>
<html>
<head>
    <title>Q33 - Quiz</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            color: #450a0a;
            text-align: center;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .quiz {
            width: 500px;
            max-width: 85%;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #fda4af;
            border-radius: 8px;
            background: #fff1f2;
            cursor: pointer;
        }

        button:hover {
            background: #fecdd3;
        }

        #result {
            font-weight: bold;
            color: #991b1b;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>JavaScript Quiz</h1>
</header>

<div class="quiz">
    <h2>Which language is used to make webpages interactive?</h2>

    <button onclick="checkAnswer('HTML')">HTML</button>
    <button onclick="checkAnswer('CSS')">CSS</button>
    <button onclick="checkAnswer('JavaScript')">JavaScript</button>
    <button onclick="checkAnswer('SQL')">SQL</button>

    <p id="result"></p>
</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function checkAnswer(answer) {
        const result = document.getElementById("result");

        if (answer === "JavaScript") {
            result.textContent = "Correct! 🎉";
        } else {
            result.textContent = "Wrong answer. Try again!";
        }
    }
</script>

</body>
</html>
