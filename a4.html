
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Images and Links</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            color: #475569;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.15);
        }

        .header {
            background: linear-gradient(135deg, #450a0a, #991b1b, #dc2626);
            color: white;
            text-align: center;
            padding: 45px 25px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #ffe4e6;
            font-size: 16px;
        }

        .content {
            padding: 40px;
        }

        .section {
            background: #fff1f2;
            border-left: 5px solid #dc2626;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            text-align: center;
        }

        h2 {
            color: #991b1b;
            font-size: 25px;
            margin-bottom: 20px;
        }

        .image-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(127, 29, 29, 0.1);
        }

        .image-box img {
            width: 300px;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 4px solid #fecdd3;
            display: block;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .links a {
            display: block;
            width: 250px;
            padding: 13px 20px;
            background: #991b1b;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .links a:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .links a:focus-visible {
            outline: 3px solid #fda4af;
            outline-offset: 3px;
        }

        .footer {
            background: #450a0a;
            color: #fecdd3;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 25px 15px;
            }

            h2 {
                font-size: 22px;
            }

            .links a {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>My Webpage</h1>
            <p>Images and Hyperlinks</p>
        </div>

        <div class="content">

            <div class="section">

                <h2>My Image</h2>

                <div class="image-box">
                    <img src="image.jpg" alt="My Image">
                </div>

            </div>

            <div class="section">

                <h2>Useful Links</h2>

                <div class="links">
                    <a href="https://www.google.com" target="_blank">
                        Visit Google
                    </a>

                    <a href="https://www.github.com" target="_blank">
                        Visit GitHub
                    </a>

                    <a href="https://www.youtube.com" target="_blank">
                        Visit YouTube
                    </a>
                </div>

            </div>

        </div>

        <div class="footer">
            HTML Practical &nbsp; | &nbsp; Images and Links
        </div>

    </div>

</body>
</html>
