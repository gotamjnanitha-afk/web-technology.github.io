<!DOCTYPE html>
<html>
<head>
    <title>Q27 - Digital Clock</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .clock {
            width: 350px;
            margin: 100px auto 30px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        #time {
            font-size: 45px;
            font-weight: bold;
            color: #b91c1c;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Digital Clock</h1>
</header>

<div class="clock">
    <div id="time">00:00:00</div>
</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function updateClock() {
        const now = new Date();

        let hours = String(now.getHours()).padStart(2, "0");
        let minutes = String(now.getMinutes()).padStart(2, "0");
        let seconds = String(now.getSeconds()).padStart(2, "0");

        document.getElementById("time").textContent =
            hours + ":" + minutes + ":" + seconds;
    }

    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
