<!DOCTYPE html>
<html>
<head>
    <title>Q59 - Frequency of Elements</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
            text-align: center;
            color: #450a0a;
        }

        header {
            background: #7f1d1d;
            color: white;
            padding: 25px;
        }

        .card {
            width: 550px;
            max-width: 85%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px #fecdd3;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #fda4af;
            border-radius: 8px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .result {
            text-align: left;
            padding: 15px;
            background: #fff1f2;
            border-radius: 8px;
            line-height: 1.8;
        }

        a {
            color: #991b1b;
        }
    </style>
</head>
<body>

<header>
    <h1>Frequency of Elements</h1>
</header>

<div class="card">

    <input type="text" id="array"
        placeholder="Example: apple,banana,apple,orange,banana">

    <br>

    <button onclick="findFrequency()">Find Frequency</button>

    <div class="result" id="result"></div>

</div>

<a href="index.html">← Back to JavaScript Programs</a>

<script>
    function findFrequency() {
        const values = document.getElementById("array").value
            .split(",")
            .map(item => item.trim())
            .filter(item => item !== "");

        const frequency = {};

        values.forEach(value => {
            frequency[value] = (frequency[value] || 0) + 1;
        });

        let output = "";

        for (const value in frequency) {
            output += `${value}: ${frequency[value]} time(s)<br>`;
        }

        document.getElementById("result").innerHTML = output;
    }
</script>

</body>
</html>
